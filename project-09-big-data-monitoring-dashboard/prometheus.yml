global:

  scrape_interval: 15s

rule_files:

  - "alert-rules.yml"

scrape_configs:

  - job_name: hadoop

    static_configs:

      - targets: ['localhost:9870']

  - job_name: spark

    static_configs:

      - targets: ['localhost:8080']

  - job_name: kafka

    static_configs:

      - targets: ['localhost:9092']

  - job_name: cassandra

    static_configs:

      - targets: ['localhost:9042']
